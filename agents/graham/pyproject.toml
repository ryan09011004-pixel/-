[project]
name = "graham-agent"
version = "0.1.0"
description = "벤저민 그레이엄의 공개 자료로 재현한 AI 페르소나 에이전트 (Claude Agent SDK). 투자 조언이 아닙니다."
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2",
    "yfinance>=0.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
graham-agent = "graham_agent.agent:main"

[tool.setuptools.packages.find]
include = ["graham_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
