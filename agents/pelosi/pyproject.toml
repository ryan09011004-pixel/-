[project]
name = "pelosi-tracker"
version = "0.1.0"
description = "하원 STOCK Act 공시(공개 자료)에서 낸시 펠로시 의원의 거래를 정리하는 도구. 비용·API 키 없음, 투자 조언 아님."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pelosi-tracker = "pelosi_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["pelosi_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
